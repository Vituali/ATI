name: CI
on: [push, pull_request]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            Extensao/package-lock.json
            Site/package-lock.json

      - name: Criar .env com secrets do GitHub
        run: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          EOF

      # ── Extensão ──────────────────────────────────
      - name: Extensao — Instalar dependências
        working-directory: Extensao
        run: npm ci

      - name: Extensao — Lint
        working-directory: Extensao
        run: npm run lint

      - name: Extensao — Build
        working-directory: Extensao
        run: npm run build

      # ── Site ──────────────────────────────────────
      - name: Site — Instalar dependências
        working-directory: Site
        run: npm ci

      - name: Site — Lint
        working-directory: Site
        run: npm run lint

      - name: Site — Build
        working-directory: Site
        run: npm run build
